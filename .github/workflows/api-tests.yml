name: API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Debug secrets
        run: |
          echo "BASE_URL set: ${{ secrets.BASE_URL != '' }}"
          echo "TOKEN set: ${{ secrets.TOKEN != '' }}"
          echo "USER_ID set: ${{ secrets.USER_ID != '' }}"

      - name: Run Postman collection
        run: |
          newman run "JSONPlaceholder API.postman_collection.json" \
            --environment "Development.postman_environment.json" \
            --env-var "baseUrl=${{ secrets.BASE_URL }}" \
            --env-var "token=${{ secrets.TOKEN }}" \
            --env-var "userId=${{ secrets.USER_ID }}" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: report.html